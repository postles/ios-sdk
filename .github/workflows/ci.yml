name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select an iOS simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]] | last | .udid')
          test -n "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: xcodebuild test -scheme Postles -destination "id=${{ steps.simulator.outputs.udid }}"
